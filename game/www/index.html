<html lang="en" data-theme="light">

<style>#shell{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:15;background:#000}body.playing #shell{display:none}#vlHud{position:fixed;inset:0;pointer-events:none;z-index:6;display:none;font:600 13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.7)}body.playing #vlHud{display:block}#vlHud .tl,#vlHud .bl{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));display:grid;gap:2px}#vlHud .tl{top:calc(10px + env(safe-area-inset-top,0px))}#vlHud .bl{bottom:calc(10px + env(safe-area-inset-bottom,0px))}#vlHud i{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;opacity:.4}#vlHud svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}body.playing #stats,body.playing #fpsVal{display:none!important}#vlHud .tl{left:calc(66px + env(safe-area-inset-left,0px))}</style>

<style id="mx-theme">:root,html[data-theme]{--bg:#000;--card:#0e0e10;--card2:#16181c;--ink:#f5f5f5;--muted:#8b8f98;--line:#2f3336;--blue:#fff;--blue2:#d9d9d9;--on-blue:#000;--chip:#16181c;--hud:rgba(14,14,16,.72);--hud-ink:#f5f5f5;--danger:#ff6b6b;--zoom:#fff;--shadow:none}#splash,#splashVer{opacity:0!important;pointer-events:none!important}#app{display:none!important}:root,html{--zoom:#3a3d42!important}#zoomBox input{accent-color:#fff!important}#zoomBox button,#zoomIn,#zoomOut{color:#fff!important;border-color:#3a3d42!important}#lbList li,#lbList li .n,#lbList li .s{color:#f2f2f2!important}</style></head>

<div id="loginGate" class="hidden"><div class="gatecard"><img src="assets/brand/logo.png" class="logo big" alt=""><b class="gatetitle">Mendlly</b><div id="gateBody"></div></div></div>
