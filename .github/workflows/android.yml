name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Links for this repository
        run: sed -i "s#__REPO__#${{ github.repository }}#g" game/www/config.js
      - name: Android SDK parts
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Minifier
        run: mkdir -p /tmp/qrg && cd /tmp/qrg && npm i terser javascript-obfuscator --silent
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd game
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/release.keystore; A="$KA"; SP="$KSP"; KPW="$KP"
          else
            echo "No keystore secret: making a new one. Updates over an older Mendlly install will need an uninstall first."
            A=mendlly; SP=$(openssl rand -hex 12); KPW=$SP
            keytool -genkeypair -keystore android/release.keystore -alias "$A" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$SP" -keypass "$KPW" -dname "CN=Mendlly"
          fi
          printf 'storeFile=android/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SP" "$A" "$KPW" > keystore.properties
      - name: Build
        env:
          NODE_PATH: /tmp/qrg/node_modules
        run: cd game && bash tools/build_apk.sh
      - run: cp game/android/build/UlarNeon.apk Mendlly.apk
      - uses: actions/upload-artifact@v4
        with: { name: Mendlly-Android, path: Mendlly.apk }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: latest, name: Mendlly latest, files: Mendlly.apk, make_latest: true }
